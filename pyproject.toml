propcache = "0.2.1"
proto-plus = "1.25.0"
protobuf = "5.28.3"
psycopg2 = "2.9.10"
psycopg2-binary = "2.9.10"
pyasn1 = "0.6.1"
pyasn1-modules = "0.4.1"
pydantic = "2.9.2"
pydantic-core = "2.23.4"
pyparsing = "3.2.0"
python-dateutil = "2.9.0.post0"
pytz = "2024.2"
requests = "2.32.3"
rsa = "4.9"
six = "1.17.0"
sqlparse = "0.5.1"
tendo = "0.3.0"
