typing-extensions = "4.12.2"
tzdata = "2024.2"
uritemplate = "4.1.1"
urllib3 = "2.2.3"
xlsxwriter = "3.2.0"
yarl = "1.18.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"