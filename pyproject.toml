[tool.poetry]
name = "venvai"
version = "0.1.0"
description = "AiCapilot"
authors = ["TheHormat"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
django = "5.1.5"
google-generativeai = "0.8.3"
python-dotenv = "1.0.1"  # Add this line
aiohappyeyeballs = "2.4.4"
aiohttp = "3.11.11"
aiosignal = "1.3.2"
annotated-types = "0.7.0"
asgiref = "3.8.1"
async-timeout = "5.0.1"
attrs = "24.3.0"
cachetools = "5.5.0"
certifi = "2024.8.30"
charset-normalizer = "3.4.0"
crispy-bootstrap5 = "2024.10"
django-crispy-forms = "2.3"
django-widget-tweaks = "1.5.0"
et-xmlfile = "2.0.0"
faker = "35.0.0"
frozenlist = "1.5.0"
geoip2 = "4.8.1"
google-ai-generativelanguage = "0.6.10"
google-api-core = "2.22.0"
google-api-python-client = "2.151.0"
google-auth = "2.35.0"
google-auth-httplib2 = "0.2.0"
googleapis-common-protos = "1.65.0"
grpcio = "1.67.1"
grpcio-status = "1.67.1"
httplib2 = "0.22.0"
idna = "3.10"
maxminddb = "2.6.3"
multidict = "6.1.0"
numpy = "2.2.1"
openpyxl = "3.1.5"
pandas = "2.2.3"
